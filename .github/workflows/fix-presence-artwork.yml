name: Finalise presence artwork fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply presence artwork cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clean artwork keys and refresh caches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          program = Path('companion/Program.cs')
          text = program.read_text(encoding='utf-8-sig')
          match = re.search(r'(var simpleKeys = new HashSet<string>\(StringComparer\.OrdinalIgnoreCase\)\s*\{)(.*?)(\n\s*\};)', text, re.S)
          if match:
              seen = set()
              cleaned = []
              for line in match.group(2).splitlines():
                  key_match = re.search(r'"([^"]+)"', line)
                  if key_match:
                      key = key_match.group(1).lower()
                      if key in seen:
                          continue
                      seen.add(key)
                  cleaned.append(line)
              text = text[:match.start(2)] + '\n'.join(cleaned) + text[match.end(2):]
          program.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8-sig')
          text = text.replace("const APP_CACHE='lofi-room-v32';", "const APP_CACHE='lofi-room-v33';")
          text = text.replace("const ASSET_VERSION='20260810c';", "const ASSET_VERSION='20260810d';")
          index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8-sig')
          text = text.replace("const CACHE='lofi-room-v32';", "const CACHE='lofi-room-v33';")
          text = text.replace("const ASSET_VERSION='20260810c';", "const ASSET_VERSION='20260810d';")
          sw.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add companion/Program.cs index.html sw.js
          git commit -m 'Finalise Discord artwork fix and refresh cache' || exit 0
          git push origin main
